name: Publish Stable Release

# Stable releases are built from calendar version tags (v26.10.0) on main; build.yml keeps publishing
# Nightly builds. The release is assembled as a draft and published only after every asset is uploaded
# and verified, so the latest-release links the app and the README follow never reach a release that
# is missing its APK or update.json. RELEASING.md describes the process.
on:
  push:
    tags:
      # Version tags only. A bare '*' also fired on scratch and backup tags, and because this
      # workflow publishes the latest release, one stray tag push was enough to promote an
      # unintended build.
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing stable tag to publish, such as v26.10.0
        required: true
        type: string
      release_name:
        description: Optional release title override
        required: false
        type: string

concurrency:
  group: publish-latest-release
  cancel-in-progress: false

jobs:
  publish-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: Telegram
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: Resolve release target
        id: release_target
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RELEASE_NAME: ${{ inputs.release_name }}
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail

          # The release tooling comes from the workflow's revision, like the setup action below, while
          # the source that is built comes from the tag.
          tools_dir="$RUNNER_TEMP/release-tools"
          mkdir -p "$tools_dir"
          cp .github/scripts/release_changes.py .github/scripts/release_manifest.py "$tools_dir/"

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            expected_workflow_ref="refs/heads/${DEFAULT_BRANCH}"
            if [ "${GITHUB_REF}" != "${expected_workflow_ref}" ]; then
              echo "Manual releases must run from the default branch (${DEFAULT_BRANCH})." >&2
              exit 1
            fi
            tag_name="${INPUT_TAG_NAME}"
          else
            tag_name="${GITHUB_REF_NAME}"
          fi

          # Stable tags are calendar versions: a two-digit year, the month and a patch number.
          if ! [[ "${tag_name}" =~ ^v[0-9]{2}\.([1-9]|1[0-2])\.(0|[1-9][0-9]*)$ ]]; then
            echo "Stable tags look like v26.10.0; ${tag_name:-<empty>} does not." >&2
            exit 1
          fi
          # Manual publishing syncs an existing git tag to GitHub Releases.
          # It never manufactures a new tag from the current branch head.
          if ! git rev-parse -q --verify "refs/tags/${tag_name}" >/dev/null; then
            echo "Tag ${tag_name} does not exist in this repository." >&2
            exit 1
          fi
          git checkout --quiet --detach "refs/tags/${tag_name}"

          if ! git check-ref-format "refs/heads/${DEFAULT_BRANCH}" >/dev/null; then
            echo "Repository default branch name is not a valid git ref: ${DEFAULT_BRANCH}" >&2
            exit 1
          fi
          git fetch --no-tags origin \
            "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"

          tag_commit=$(git rev-parse HEAD)
          minimum_supported_release_commit=641913a4efa743b200454b10b4d2e41ac02f1f39

          # The shared setup action consumes the duckdetector.android.* property contract added by
          # this commit. Earlier revisions are deliberately unsupported instead of being rebuilt
          # with guessed modern Android toolchain versions.
          if ! git merge-base --is-ancestor \
            "${minimum_supported_release_commit}" \
            "${tag_commit}"; then
            echo "Release tag predates the supported historical-build baseline (${minimum_supported_release_commit})." >&2
            exit 1
          fi

          # Build logic from the selected source revision receives release signing credentials.
          # Only commits already accepted into the default branch belong to that trust boundary.
          if ! git merge-base --is-ancestor \
            "${tag_commit}" \
            "origin/${DEFAULT_BRANCH}"; then
            echo "Release tag must point to a commit reachable from ${DEFAULT_BRANCH}." >&2
            exit 1
          fi

          # A published stable release is final: users and update.json already refer to its files.
          # A draft is what an interrupted run leaves behind, and this run rebuilds it.
          releases=$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100")
          if jq -e --arg tag "${tag_name}" '[.[][] | select(.tag_name == $tag and (.draft | not))] | length > 0' \
            <<<"$releases" >/dev/null; then
            echo "${tag_name} is already published. Tag a new patch version instead of rebuilding it." >&2
            exit 1
          fi
          while IFS= read -r draft_id; do
            [ -n "$draft_id" ] || continue
            echo "Deleting draft release ${draft_id} left for ${tag_name} by an earlier run."
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${draft_id}" >/dev/null
          done < <(jq -r --arg tag "${tag_name}" '.[][] | select(.tag_name == $tag and .draft) | .id' <<<"$releases")

          # GitHub picks the previous release itself when none is named, and the moving nightly
          # prerelease could be that release. The first stable release has no previous tag and
          # lists the whole history.
          previous_tag=$(python3 - "$tools_dir" "${tag_name}" <<'PY'
          import sys
          sys.path.insert(0, sys.argv[1])
          import release_changes
          print(release_changes.previous_stable_tag(".", sys.argv[2]) or "", end="")
          PY
          )

          release_name="${INPUT_RELEASE_NAME:-}"
          if [ -z "${release_name}" ]; then
            release_name="Duck Detector ${tag_name#v}"
          fi

          {
            echo "tag_name=${tag_name}"
            echo "version=${tag_name#v}"
            echo "tag_commit=${tag_commit}"
            echo "previous_tag=${previous_tag}"
            echo "release_name=${release_name}"
            echo "tools_dir=${tools_dir}"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing ${tag_name} (${tag_commit}); previous stable tag: ${previous_tag:-none}."

      - name: Set up Android build toolchain
        id: toolchain
        uses: $/.github/actions/setup-android-build
        with:
          # Tag builds restore the cache but do not write it back: GitHub scopes a cache entry to
          # the ref that created it, so an entry written from refs/tags/v* can never be read by
          # another branch or tag and would only consume the repository cache quota.
          cache-read-only: "true"

      - name: Validate credentials and prepare release keystore
        id: keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          required_secrets=(
            ANDROID_KEYSTORE_BASE64
            ANDROID_KEYSTORE_PASSWORD
            ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD
            TELEGRAM_BOT_TOKEN
            TELEGRAM_CHAT_ID
          )
          missing_secrets=()
          for secret_name in "${required_secrets[@]}"; do
            if [ -z "${!secret_name:-}" ]; then
              missing_secrets+=("${secret_name}")
            fi
          done
          if [ "${#missing_secrets[@]}" -ne 0 ]; then
            printf 'Missing required secrets in the Telegram environment: %s\n' \
              "$(IFS=', '; echo "${missing_secrets[*]}")" >&2
            exit 1
          fi

          keystore_path="$RUNNER_TEMP/release.keystore"
          if ! printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "$keystore_path"; then
            echo "ANDROID_KEYSTORE_BASE64 is not valid base64." >&2
            exit 1
          fi
          if [ ! -s "${keystore_path}" ]; then
            echo "Decoded release keystore is empty." >&2
            exit 1
          fi
          chmod 600 "${keystore_path}"
          echo "keystore_path=$keystore_path" >> "$GITHUB_OUTPUT"

      - name: Extract expected signing fingerprint
        id: signing_fingerprint
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          keytool_output=$(keytool -J-Duser.language=en -J-Duser.country=US -list -v \
            -keystore "${ANDROID_KEYSTORE_PATH}" \
            -storepass "${ANDROID_KEYSTORE_PASSWORD}" \
            -alias "${ANDROID_KEY_ALIAS}")

          expected_sha256=$(printf '%s\n' "${keytool_output}" \
            | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' \
            | head -n 1 \
            | tr -d '[:space:]:' \
            | tr '[:upper:]' '[:lower:]')

          owner_line=$(printf '%s\n' "${keytool_output}" \
            | sed -n 's/^Owner: //p' \
            | head -n 1)

          signer_name=$(OWNER_LINE="${owner_line}" python3 - <<'PY'
          import os
          import re

          owner = os.environ.get("OWNER_LINE", "").strip()
          if not owner:
              print("Unknown signer", end="")
              raise SystemExit(0)

          match = re.search(r"(?:^|,\s*)CN=([^,]+)", owner)
          if match:
              print(match.group(1).strip(), end="")
          else:
              print(owner, end="")
          PY
          )

          if [ -z "${expected_sha256}" ]; then
            echo "Failed to extract SHA-256 fingerprint from the configured keystore." >&2
            exit 1
          fi

          echo "sha256=${expected_sha256}" >> "$GITHUB_OUTPUT"
          echo "signer_name=${signer_name}" >> "$GITHUB_OUTPUT"

      - name: Build release APK and SDK AAR
        id: build
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TAG_NAME: ${{ steps.release_target.outputs.tag_name }}
        run: |
          set -euo pipefail

          start_time=$(date +%s)
          build_time_utc=$(date -u +%Y%m%d%H%M%S)
          build_time_iso=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # GITHUB_SHA names the workflow's commit on manual runs; the build hash must name the tag's.
          env -u GITHUB_SHA ./gradlew \
            --stacktrace \
            -Pduckdetector.releaseTag="${TAG_NAME}" \
            -Pduckdetector.buildTimeUtc="${build_time_utc}" \
            -Pduckdetector.teeCrl.refresh=true \
            -Pduckdetector.githubContributors.refresh=true \
            :app:assembleRelease \
            :sdk:aar:assemble
          end_time=$(date +%s)

          duration_seconds=$((end_time - start_time))
          printf -v duration_human "%dm %02ds" "$((duration_seconds / 60))" "$((duration_seconds % 60))"
          echo "duration_human=$duration_human" >> "$GITHUB_OUTPUT"
          echo "build_time_iso=$build_time_iso" >> "$GITHUB_OUTPUT"

      - name: Collect release metadata
        id: metadata
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.release_target.outputs.version }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata_candidates = [
              Path("app/build/outputs/apk/release/output-metadata.json"),
              Path("app/release/output-metadata.json"),
          ]
          metadata_path = next((path for path in metadata_candidates if path.exists()), None)
          if metadata_path is None:
              raise SystemExit("Release output-metadata.json not found in app/release or app/build/outputs/apk/release.")
          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          apk_elements = [
              element for element in metadata.get("elements") or []
              if element.get("outputFile", "").endswith(".apk")
          ]
          universal_elements = [
              element for element in apk_elements
              if (element.get("type") or "").upper() == "UNIVERSAL"
              or element.get("outputFile", "").endswith("-Universal.apk")
          ]
          if len(universal_elements) == 1:
              selected = universal_elements[0]
          elif len(apk_elements) == 1:
              selected = apk_elements[0]
          else:
              raise SystemExit(f"Expected a single release APK entry, found {len(apk_elements)}.")

          output_file = selected.get("outputFile", "")
          if not output_file or Path(output_file).name != output_file:
              raise SystemExit(f"Unsafe release APK output path: {output_file!r}.")
          apk_path = metadata_path.parent / output_file
          if not apk_path.is_file() or apk_path.stat().st_size <= 0:
              raise SystemExit(f"Release APK not found at {apk_path}.")

          version_name = selected.get("versionName")
          version_code = selected.get("versionCode")
          if version_name != os.environ["EXPECTED_VERSION"]:
              raise SystemExit(
                  f"The tagged source built versionName {version_name!r}, not "
                  f"{os.environ['EXPECTED_VERSION']!r}. Stable tags must be on commits whose build "
                  "logic reads duckdetector.releaseTag."
              )
          if not isinstance(version_code, int) or isinstance(version_code, bool) or version_code <= 0:
              raise SystemExit(f"Release APK versionCode is invalid: {version_code!r}.")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"apk_path={apk_path}\n")
              output.write(f"version_name={version_name}\n")
              output.write(f"version_code={version_code}\n")
          PY

      - name: Verify APK signature
        shell: bash
        env:
          APK_PATH: ${{ steps.metadata.outputs.apk_path }}
          BUILD_TOOLS: ${{ steps.toolchain.outputs.build-tools }}
          EXPECTED_SIGNER_SHA256: ${{ steps.signing_fingerprint.outputs.sha256 }}
        run: |
          set -euo pipefail

          apksigner_output=$("${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/apksigner" verify --print-certs "${APK_PATH}")
          actual_sha256=$(APKSIGNER_OUTPUT="${apksigner_output}" python3 - <<'PY'
          import os

          output = os.environ.get("APKSIGNER_OUTPUT", "")
          marker = "certificate SHA-256 digest:"
          for raw_line in output.splitlines():
              if marker not in raw_line or "Source Stamp" in raw_line:
                  continue
              digest = raw_line.split(marker, 1)[1].replace(":", "").strip().lower()
              if digest:
                  print(digest, end="")
                  break
          PY
          )

          if [ -z "${actual_sha256}" ] || [ "${actual_sha256}" != "${EXPECTED_SIGNER_SHA256}" ]; then
            echo "APK was not signed with the expected certificate." >&2
            exit 1
          fi

      - name: Stage release assets
        id: assets
        shell: bash
        env:
          APK_PATH: ${{ steps.metadata.outputs.apk_path }}
          VERSION: ${{ steps.release_target.outputs.version }}
        run: |
          set -euo pipefail

          # GitHub renames assets whose names hold spaces or other special characters, so the files
          # are uploaded under names that stay as written and that update.json can link in advance.
          apk_name="Duck.Detector-${VERSION}.apk"
          aar_name="duckdetector-sdk-${VERSION}.aar"
          aar_source=sdk/aar/build/outputs/aar/aar.aar
          if [ ! -s "$aar_source" ]; then
            echo "SDK AAR is missing or empty: $aar_source" >&2
            exit 1
          fi
          unzip -tq "$aar_source" >/dev/null

          mkdir -p release-assets
          cp "${APK_PATH}" "release-assets/${apk_name}"
          cp "$aar_source" "release-assets/${aar_name}"
          (cd release-assets && sha256sum "${apk_name}" "${aar_name}" > SHA256SUMS)

          {
            echo "apk_name=${apk_name}"
            echo "aar_name=${aar_name}"
            echo "apk_sha256=$(sha256sum "release-assets/${apk_name}" | cut -d' ' -f1)"
            echo "aar_sha256=$(sha256sum "release-assets/${aar_name}" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Generate the changelog
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIOUS_TAG: ${{ steps.release_target.outputs.previous_tag }}
          TAG_NAME: ${{ steps.release_target.outputs.tag_name }}
        run: |
          set -euo pipefail

          # GitHub's generated notes list the pull requests merged since the previous tag, their
          # authors and first-time contributors.
          arguments=(-f "tag_name=${TAG_NAME}")
          if [ -n "${PREVIOUS_TAG}" ]; then
            arguments+=(-f "previous_tag_name=${PREVIOUS_TAG}")
          fi
          error_file="$RUNNER_TEMP/gh-api-notes-error"
          for attempt in 1 2 3 4; do
            if gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" "${arguments[@]}" \
              --jq '.body' > changelog.md 2>"$error_file"; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              cat "$error_file" >&2
              exit 1
            fi
            echo "Release notes generation failed (attempt ${attempt}/4); retrying..." >&2
            sleep $((attempt * 2))
          done
          if [ ! -s changelog.md ]; then
            echo "GitHub returned empty release notes." >&2
            exit 1
          fi

      - name: Write update.json
        shell: bash
        env:
          APK_NAME: ${{ steps.assets.outputs.apk_name }}
          BUILD_TIME_ISO: ${{ steps.build.outputs.build_time_iso }}
          TAG_NAME: ${{ steps.release_target.outputs.tag_name }}
          TOOLS_DIR: ${{ steps.release_target.outputs.tools_dir }}
          VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
          VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
        run: |
          set -euo pipefail

          python3 "${TOOLS_DIR}/release_manifest.py" \
            --repository "${GITHUB_REPOSITORY}" \
            --tag "${TAG_NAME}" \
            --apk "release-assets/${APK_NAME}" \
            --version-name "${VERSION_NAME}" \
            --version-code "${VERSION_CODE}" \
            --built-at "${BUILD_TIME_ISO}" \
            --notes changelog.md \
            --output release-assets/update.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/${{ steps.assets.outputs.apk_name }}
            release-assets/${{ steps.assets.outputs.aar_name }}

      - name: Write the release body
        shell: bash
        env:
          AAR_NAME: ${{ steps.assets.outputs.aar_name }}
          AAR_SHA256: ${{ steps.assets.outputs.aar_sha256 }}
          APK_NAME: ${{ steps.assets.outputs.apk_name }}
          APK_SHA256: ${{ steps.assets.outputs.apk_sha256 }}
          SIGNER_NAME: ${{ steps.signing_fingerprint.outputs.signer_name }}
          SIGNER_SHA256: ${{ steps.signing_fingerprint.outputs.sha256 }}
        run: |
          set -euo pipefail

          # shellcheck disable=SC2016 # The backticks are Markdown code spans.
          {
            cat changelog.md
            printf '\n\n## Verification\n\n'
            printf '| Asset | SHA-256 |\n| --- | --- |\n'
            printf '| `%s` | `%s` |\n' "${APK_NAME}" "${APK_SHA256}" "${AAR_NAME}" "${AAR_SHA256}"
            printf '\nThe APK is signed by %s, certificate SHA-256 `%s`. ' "${SIGNER_NAME}" "${SIGNER_SHA256}"
            printf 'GitHub attests that this workflow built both files:\n\n'
            printf '```\ngh attestation verify %s --repo %s\n```\n' "${APK_NAME}" "${GITHUB_REPOSITORY}"
          } > release-body.md

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.release_target.outputs.tag_name }}
          path: release-assets/
          if-no-files-found: error

      - name: Create the draft release
        id: draft
        shell: bash
        env:
          AAR_NAME: ${{ steps.assets.outputs.aar_name }}
          APK_NAME: ${{ steps.assets.outputs.apk_name }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NAME: ${{ steps.release_target.outputs.release_name }}
          TAG_NAME: ${{ steps.release_target.outputs.tag_name }}
        run: |
          set -euo pipefail

          gh release create "${TAG_NAME}" \
            --draft \
            --verify-tag \
            --title "${RELEASE_NAME}" \
            --notes-file release-body.md \
            "release-assets/${APK_NAME}" \
            "release-assets/${AAR_NAME}" \
            release-assets/SHA256SUMS \
            release-assets/update.json

          release_id=$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq -r --arg tag "${TAG_NAME}" '[.[][] | select(.tag_name == $tag and .draft)] | if length == 1 then .[0].id else empty end')
          if ! [[ "${release_id}" =~ ^[0-9]+$ ]]; then
            echo "Could not find exactly one draft release for ${TAG_NAME}." >&2
            exit 1
          fi
          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"

      - name: Verify the draft's assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        run: |
          set -euo pipefail

          assets=$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100")
          expected=$(cd release-assets && for file in *; do
            jq -n --arg name "$file" --argjson size "$(stat -c '%s' "$file")" \
              --arg digest "sha256:$(sha256sum "$file" | cut -d' ' -f1)" '{name: $name, size: $size, digest: $digest}'
          done | jq -s 'sort_by(.name)')
          if ! jq -e --argjson expected "$expected" '
            [.[][] | {name, size, digest: (.digest // null), state}] | sort_by(.name) as $actual |
            ($actual | length) == ($expected | length) and
            ([range(0; $expected | length) as $i |
              $actual[$i].name == $expected[$i].name and
              $actual[$i].size == $expected[$i].size and
              $actual[$i].state == "uploaded" and
              ($actual[$i].digest == null or ($actual[$i].digest | ascii_downcase) == $expected[$i].digest)
            ] | all)' <<<"$assets" >/dev/null; then
            echo "The draft's assets do not match the files built in this run." >&2
            jq '[.[][] | {name, size, digest, state}]' <<<"$assets" >&2
            exit 1
          fi

      - name: Publish the release as latest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        run: |
          set -euo pipefail

          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false \
            -F prerelease=false \
            -f make_latest=true >/dev/null

      - name: Verify the latest-release links
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release_target.outputs.tag_name }}
        run: |
          set -euo pipefail

          # The app reads releases/latest/download/update.json, which redirects to the newest
          # published full release once GitHub has propagated it.
          manifest_url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/update.json"
          verified=false
          for attempt in {1..12}; do
            latest_tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name' 2>/dev/null || true)
            if [ "${latest_tag}" = "${TAG_NAME}" ] &&
              curl --silent --show-error --fail --location --proto '=https' --tlsv1.2 \
                --output published-update.json "${manifest_url}" &&
              cmp --silent release-assets/update.json published-update.json; then
              verified=true
              break
            fi
            echo "Latest release is ${latest_tag:-unknown}, not yet ${TAG_NAME} (attempt ${attempt}/12); waiting..." >&2
            sleep 5
          done
          if [ "${verified}" != true ]; then
            echo "releases/latest does not serve ${TAG_NAME}'s update.json." >&2
            exit 1
          fi

          apk_url=$(jq -r '.apk.downloadUrl' release-assets/update.json)
          curl --silent --show-error --fail --location --range 0-0 --proto '=https' --tlsv1.2 \
            --output /dev/null "${apk_url}"

      - name: Push APK to Telegram channel
        shell: bash
        env:
          APK_NAME: ${{ steps.assets.outputs.apk_name }}
          COMMIT: ${{ steps.release_target.outputs.tag_commit }}
          SIGNER_NAME: ${{ steps.signing_fingerprint.outputs.signer_name }}
          TAG_NAME: ${{ steps.release_target.outputs.tag_name }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
          VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
        run: |
          set -euo pipefail

          apk_path="release-assets/${APK_NAME}"
          if [ "$(stat -c '%s' "${apk_path}")" -gt $((50 * 1024 * 1024)) ]; then
            echo "The APK exceeds Telegram Bot API's 50 MiB upload limit." >&2
            exit 1
          fi

          caption=$(python3 - <<'PY'
          import html
          import os

          web = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
          tag = os.environ["TAG_NAME"]
          commit = os.environ["COMMIT"]
          lines = [
              f"<b>Duck Detector {html.escape(os.environ['VERSION_NAME'])}</b> · Stable",
              "",
              f'Release notes: <a href="{web}/releases/tag/{html.escape(tag, quote=True)}">{html.escape(tag)}</a>',
              f"Version code: <b>{html.escape(os.environ['VERSION_CODE'])}</b>",
              f'Commit: <a href="{web}/commit/{commit}">{commit[:8]}</a>',
              f"Signature: <b>verified by {html.escape(os.environ['SIGNER_NAME'] or 'Unknown signer')}</b>",
              "Build provenance: <b>attested by GitHub</b>",
          ]
          print("\n".join(lines), end="")
          PY
          )

          response_file=$(mktemp)
          trap 'rm -f "${response_file}"' EXIT
          if ! http_code=$(curl \
            --silent \
            --show-error \
            --connect-timeout 15 \
            --max-time 300 \
            --proto '=https' \
            --tlsv1.2 \
            --output "${response_file}" \
            --write-out "%{http_code}" \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "document=@${apk_path}" \
            -F "parse_mode=HTML" \
            --form-string "caption=${caption}"); then
            echo "Telegram upload failed due to a network or timeout error." >&2
            exit 1
          fi
          if [ "${http_code}" != "200" ] || ! jq -e '.ok == true and .result.message_id != null' \
            "${response_file}" >/dev/null; then
            echo "Telegram API returned HTTP ${http_code}." >&2
            cat "${response_file}" >&2
            exit 1
          fi

      - name: Clean up signing material
        if: always()
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
        run: |
          set -euo pipefail
          keystore_path="${ANDROID_KEYSTORE_PATH:-$RUNNER_TEMP/release.keystore}"
          if [ -f "${keystore_path}" ]; then
            rm -f -- "${keystore_path}"
          fi
